# ==============================================================================
# Google Cloud Build CI/CD Pipeline Specification
# Standardized for Google Cloud Consulting (GCC) Forward Deployed Engineering
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Run Automated Backend Pytest Suite
  # ----------------------------------------------------------------------------
  - name: 'python:3.11-slim'
    id: 'backend-unit-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        python -m venv .venv
        . .venv/bin/activate
        pip install --no-cache-dir -r backend/requirements.txt
        pip install --no-cache-dir pytest
        pytest -v

  # ----------------------------------------------------------------------------
  # Step 2: Build & Type-Check React Frontend
  # ----------------------------------------------------------------------------
  - name: 'node:20-alpine'
    id: 'frontend-build-check'
    dir: 'frontend'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm ci
        npm run build

  # ----------------------------------------------------------------------------
  # Step 3: Build Multi-Stage Backend Container Image
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend-image'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/fde-repo/fde-backend:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/fde-repo/fde-backend:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # ----------------------------------------------------------------------------
  # Step 4: Container Vulnerability Scan (Trivy / Container Analysis)
  # ----------------------------------------------------------------------------
  - name: 'aquasec/trivy:latest'
    id: 'security-vulnerability-scan'
    args:
      - 'image'
      - '--severity'
      - 'CRITICAL'
      - '--exit-code'
      - '0' # Non-blocking in CI preview, exit-code 1 in production gate
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/fde-repo/fde-backend:$COMMIT_SHA'

  # ----------------------------------------------------------------------------
  # Step 5: Push Container Images to Google Artifact Registry
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-artifact-registry'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/fde-repo/fde-backend:$COMMIT_SHA'

  # ----------------------------------------------------------------------------
  # Step 6: Deploy to Google Cloud Run v2 (Serverless Container)
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'fde-enterprise-backend'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/fde-repo/fde-backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--set-secrets=DB_PASSWORD=fde-db-password:latest,SECRET_KEY=fde-jwt-secret:latest'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/fde-repo/fde-backend:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/fde-repo/fde-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
