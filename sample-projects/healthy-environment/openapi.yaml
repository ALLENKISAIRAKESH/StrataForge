openapi: 3.0.3
info:
  title: Acme Enterprise Knowledge API
  version: 1.0.0
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
  /api/v1/documents:
    get:
      summary: List documents
      responses:
        '200':
          description: List of documents
